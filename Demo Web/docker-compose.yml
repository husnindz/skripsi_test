services:
  ollama:
    image: ollama/ollama:latest
    container_name: aethermed_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  aethermed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aethermed_demo
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=medgemma1.5:4b
    depends_on:
      - ollama
    volumes:
      - ./models:/app/models
    restart: unless-stopped

volumes:
  ollama_data:
